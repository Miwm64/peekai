version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose    # unclosed HTTP bodies in AI providers
    - contextcheck # ctx must flow through the pipeline
    - errorlint    # errors.Is / errors.As
    - gocritic
    - misspell
    - noctx        # HTTP requests without context
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
          disabled: true # internal packages; don't force docs on everything
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck, unparam]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Miwm64/peekai
