name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each OS builds natively: peekai uses cgo on macOS and Linux (hotkeys,
  # windows, screen capture), which doesn't cross-compile cleanly.
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
          - name: windows-amd64
            os: windows-latest
          - name: linux-amd64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for git describe

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; else v="$(git describe --tags --always)"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          mkdir -p dist

      - name: Install X11/GL headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          make app VERSION="$VERSION"
          ditto -c -k --keepParent bin/peekai.app "dist/peekai-$VERSION-${{ matrix.name }}.zip"

      - name: Build Windows
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-s -w -X main.version=$VERSION" -o bin/peekai.exe ./cmd/peekai
          cp README.md bin/
          7z a "dist/peekai-$VERSION-${{ matrix.name }}.zip" ./bin/peekai.exe ./bin/README.md

      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          go build -ldflags "-s -w -X main.version=$VERSION" -o bin/peekai ./cmd/peekai
          cp README.md bin/
          tar -czf "dist/peekai-$VERSION-${{ matrix.name }}.tar.gz" -C bin peekai README.md

      - uses: actions/upload-artifact@v7
        with:
          name: peekai-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
